<!-- teacher-login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Teacher Login</title>
</head>
<body>
  <h2>Teacher Login</h2>
  <form id="teacherLoginForm">
    <input type="text" id="username" placeholder="Username" required><br>
    <input type="password" id="password" placeholder="Password" required><br>
    <input type="text" id="captchaInput" placeholder="Enter CAPTCHA" required><br>
    <button type="submit">Login</button>
  </form>

  <script>
    document.getElementById("teacherLoginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const captchaInput = document.getElementById("captchaInput").value;

      const res = await fetch("/teacher/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password, captchaId: "dummyId", captchaInput })
      });

      const data = await res.json();
      if (data.success) {
        localStorage.setItem("teacherToken", data.token);
        window.location.href = "teacher-dashboard.html";
      } else {
        alert(data.message);
      }
    });
  </script>
</body>
</html>
